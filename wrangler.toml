name = "angkringan-widoro"
compatibility_date = "2024-04-01"
pages_build_output_dir = "public"

# Cloudflare D1 Relational Database Binding
# Untuk membuat D1 database di Cloudflare: npx wrangler d1 create angkringan-widoro-db
[[d1_databases]]
binding = "DB"
database_name = "angkringan-widoro-db"
database_id = "xxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx" # Ganti dengan ID database D1 Anda saat deploy

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "angkringan_widoro_secret_key_heritage"
